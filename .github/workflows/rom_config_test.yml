name: LumineDroid-A17-Config-Test

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'LumineDroid Manifest Branch'
        required: true
        default: 'camellia'
        type: string
      DEVICE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'camellia'
        type: string
      TARGET:
        description: 'Lunch Target'
        required: true
        default: 'A750-trunk_staging-userdebug'
        type: string

jobs:
  config_test:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check Out CI Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free Disk Space and Allocate 24G Swap
        run: |
          echo "== Disk space before cleanup =="
          df -h /
          
          curl -sL https://raw.githubusercontent.com/sysretq0/android-kernel-builder/main/tools/free-disk-space.sh -o /tmp/free-disk-space.sh
          chmod +x /tmp/free-disk-space.sh
          sudo FD_FORCE=1 bash /tmp/free-disk-space.sh
          
          echo "== Disk space after cleanup =="
          df -h /

      - name: Set up Environment and Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf libelf-dev liblz4-tool libncurses-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3
          
          # Install repo tool
          sudo curl -sL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo

      - name: Configure Git for Private Repositories
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Secret 'GH_PAT' is missing in repository settings. A Personal Access Token with repo scope is required to access private trees."
            exit 1
          fi
          
          # Remove any runner-level extraheader from checkout
          git config --global --unset-all http.https://github.com/.extraheader || true
          git config --system --unset-all http.https://github.com/.extraheader || true
          
          # Configure .netrc for git, curl, and python/repo tool
          cat << EOF > ~/.netrc
          machine github.com
          login x-access-token
          password ${GH_PAT}
          EOF
          chmod 600 ~/.netrc
          
          # Mask token and rewrite GitHub URLs transparently without credential leakage
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "git@github.com:"
          
          # Set git committer identity for patches
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Init and Sync ROM Trees
        run: |
          mkdir -p workspace && cd workspace
          
          # Initialize LumineDroid camellia manifest
          repo init -u https://github.com/LumineDroid/platform_manifest.git -b ${{ github.event.inputs.MANIFEST_BRANCH }} --git-lfs --depth=1
          
          # Write directly to baristablend.xml so LumineDroid's barista tool recognizes it as already blended
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/baristablend.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <!-- DO NOT EDIT - Generated by barista -->
          <manifest>
            <project name="sysretq0/android_device_inoi_A750" path="device/inoi/A750" remote="github" revision="${{ github.event.inputs.DEVICE_BRANCH }}" />
            <project name="sysretq0/android_device_inoi_A750-kernel" path="device/inoi/A750-kernel" remote="github" revision="${{ github.event.inputs.DEVICE_BRANCH }}" />
            <project name="sysretq0/proprietary_vendor_inoi_A750" path="vendor/inoi/A750" remote="github" revision="${{ github.event.inputs.DEVICE_BRANCH }}" />
            <project name="LumineDroid/android_device_mediatek_sepolicy_vndr" path="device/mediatek/sepolicy_vndr" remote="github" revision="camellia" />
            <project name="LumineDroid/android_hardware_mediatek" path="hardware/mediatek" remote="github" revision="camellia" />
          </manifest>
          EOF
          
          # Sync only the build system, Go toolchain, vendor configuration, and device trees
          # This takes ~3.6 GB instead of >150 GB for full AOSP, avoiding out-of-disk crashes on 75GB runners
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all) \
            build/make \
            build/soong \
            build/blueprint \
            build/release \
            external/golang-protobuf \
            external/starlark-go \
            external/pogreb \
            prebuilts/build-tools \
            prebuilts/go/linux-x86 \
            toolchain/pgo-profiles \
            vendor/lumine \
            frameworks/native \
            device/lumine/sepolicy \
            device/inoi/A750 \
            device/inoi/A750-kernel \
            vendor/inoi/A750 \
            hardware/mediatek \
            device/mediatek/sepolicy_vndr
          
          # Ensure vendor/lineage compatibility symlink
          if [ -d vendor/lumine ] && [ ! -d vendor/lineage ]; then
            ln -sf lumine vendor/lineage
          fi
          
          # Set up LumineDroid vendor/products integration for A750
          mkdir -p vendor/products/A750
          cat << 'EOF' > vendor/products/A750/beans.xml
          <?xml version='1.0' encoding='utf-8'?>
          <manifest>
            <project path="device/inoi/A750" name="sysretq0/android_device_inoi_A750" remote="github" revision="${{ github.event.inputs.DEVICE_BRANCH }}" />
            <project path="device/inoi/A750-kernel" name="sysretq0/android_device_inoi_A750-kernel" remote="github" revision="${{ github.event.inputs.DEVICE_BRANCH }}" />
            <project path="vendor/inoi/A750" name="sysretq0/proprietary_vendor_inoi_A750" remote="github" revision="${{ github.event.inputs.DEVICE_BRANCH }}" />
            <project path="hardware/mediatek" name="LumineDroid/android_hardware_mediatek" remote="github" revision="camellia" />
            <project path="device/mediatek/sepolicy_vndr" name="LumineDroid/android_device_mediatek_sepolicy_vndr" remote="github" revision="camellia" />
          </manifest>
          EOF
          cp device/inoi/A750/A750.mk vendor/products/A750/A750.mk
          if [ -f vendor/products/AndroidProducts.mk ]; then
            if ! grep -q "A750/A750.mk" vendor/products/AndroidProducts.mk; then
              echo 'PRODUCT_MAKEFILES += $(LOCAL_DIR)/A750/A750.mk' >> vendor/products/AndroidProducts.mk
            fi
          fi
          
          # Stub vendor/pixel configurations and satisfy AFDO profile requirements
          mkdir -p vendor/pixel/clocks/products vendor/pixel/gms/products vendor/pixel/prebuilts vendor/pixel/sounds/products
          touch vendor/pixel/clocks/products/clocks.mk
          touch vendor/pixel/gms/products/gms.mk
          touch vendor/pixel/prebuilts/config.mk
          touch vendor/pixel/sounds/products/sounds.mk
          mkdir -p toolchain/pgo-profiles/sampling
          [ -f toolchain/pgo-profiles/sampling/afdo_profiles.mk ] || touch toolchain/pgo-profiles/sampling/afdo_profiles.mk

      - name: Clean Git Credentials
        if: always()
        run: |
          rm -f ~/.netrc
          git config --global --unset-all url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf || true
          git config --global --unset-all url."git@github.com:".insteadOf || true

      - name: "Test 1: Target Resolution & Build Variables (Lunch)"
        run: |
          cd workspace
          source build/envsetup.sh
          
          echo "== Testing Lunch Target =="
          lunch ${{ github.event.inputs.TARGET }}
          
          echo "== Dump Target Build Variables =="
          echo "TARGET_DEVICE: $(get_build_var TARGET_DEVICE)"
          echo "TARGET_ARCH: $(get_build_var TARGET_ARCH)"
          echo "TARGET_2ND_ARCH: $(get_build_var TARGET_2ND_ARCH)"
          echo "BOARD_BOOTIMAGE_PARTITION_SIZE: $(get_build_var BOARD_BOOTIMAGE_PARTITION_SIZE)"
          echo "BOARD_SUPER_PARTITION_SIZE: $(get_build_var BOARD_SUPER_PARTITION_SIZE)"
          echo "BOARD_SUPER_PARTITION_GROUPS: $(get_build_var BOARD_SUPER_PARTITION_GROUPS)"

      - name: "Test 2: Prebuilt Kernel, DTB & Modules Integrity"
        run: |
          cd workspace
          python3 - << 'EOF'
          import os, sys

          k_dir = "device/inoi/A750-kernel"
          assert os.path.exists(os.path.join(k_dir, "Image.gz")), "FATAL: Image.gz missing!"
          assert os.path.exists(os.path.join(k_dir, "dtb", "mt6789.dtb")), "FATAL: mt6789.dtb missing!"

          checks = [
              ("modules.load.vendor_ramdisk", "modules_ramdisk"),
              ("modules.load", "modules_dlkm"),
              ("modules.load.recovery", "modules_ramdisk"),
          ]

          total_modules = 0
          for load_file, mod_dir in checks:
              file_path = os.path.join(k_dir, load_file)
              with open(file_path) as f:
                  mods = [l.strip() for l in f if l.strip() and not l.startswith("#")]
              missing = [m for m in mods if not os.path.exists(os.path.join(k_dir, mod_dir, m))]
              print(f"[{load_file}] {len(mods)} modules checked. Missing: {len(missing)}")
              total_modules += len(mods)
              if missing:
                  for m in missing[:10]:
                      print(f"  Missing: {m}")
                  sys.exit(1)

          print(f"✓ Successfully verified {total_modules} kernel modules, kernel image, and DTB.")
          EOF

      - name: "Test 3: Proprietary Blobs & Copy-Files Completeness"
        run: |
          cd workspace
          python3 - << 'EOF'
          import os, sys, re

          v_dir = "vendor/inoi/A750"
          p_file = "device/inoi/A750/proprietary-files.txt"

          # 1. Check proprietary-files.txt
          with open(p_file) as f:
              entries = [l.strip() for l in f if l.strip() and not l.startswith("#")]

          missing_p = []
          for l in entries:
              clean = l.split(";")[0].split("|")[0].lstrip("-+")
              dest = clean.split(":")[1] if ":" in clean else clean
              if not os.path.exists(os.path.join(v_dir, "proprietary", dest)):
                  missing_p.append(dest)

          print(f"[proprietary-files.txt] {len(entries)} files checked. Missing: {len(missing_p)}")
          if missing_p:
              for m in missing_p[:10]:
                  print(f"  Missing: {m}")
              sys.exit(1)

          # 2. Check PRODUCT_COPY_FILES
          mk_file = os.path.join(v_dir, "A750-vendor.mk")
          missing_copy = []
          total_copy = 0
          with open(mk_file) as f:
              in_copy = False
              for line in f:
                  if "PRODUCT_COPY_FILES" in line:
                      in_copy = True
                      continue
                  if in_copy:
                      clean = line.rstrip("\\").strip()
                      if ":" in clean:
                          src = clean.split(":")[0].strip()
                          rel = src.replace("vendor/inoi/A750/", "")
                          total_copy += 1
                          if not os.path.exists(os.path.join(v_dir, rel)):
                              missing_copy.append(src)

          print(f"[PRODUCT_COPY_FILES] {total_copy} copy rules checked. Missing: {len(missing_copy)}")
          if missing_copy:
              for m in missing_copy[:10]:
                  print(f"  Missing: {m}")
              sys.exit(1)

          # 3. Check Android.bp prebuilts
          bp_file = os.path.join(v_dir, "Android.bp")
          missing_bp = []
          total_bp = 0
          with open(bp_file) as f:
              for line in f:
                  m = re.search(r'"(proprietary/[^"]+)"', line)
                  if m:
                      src = m.group(1)
                      total_bp += 1
                      if not os.path.exists(os.path.join(v_dir, src)):
                          missing_bp.append(src)

          print(f"[Android.bp prebuilts] {total_bp} prebuilt modules checked. Missing: {len(missing_bp)}")
          if missing_bp:
              for m in missing_bp[:10]:
                  print(f"  Missing: {m}")
              sys.exit(1)

          print("✓ 100% of declared proprietary blobs and copy-files verified on disk.")
          EOF

      - name: "Test 4: Blueprint Syntax and Formatting (bpfmt)"
        run: |
          cd workspace
          echo "== Linting device/inoi/A750/Android.bp =="
          prebuilts/build-tools/linux-x86/bin/bpfmt -d device/inoi/A750/Android.bp
          echo "== Linting vendor/inoi/A750/Android.bp =="
          prebuilts/build-tools/linux-x86/bin/bpfmt -d vendor/inoi/A750/Android.bp
          echo "✓ Blueprint syntax is valid and conforms to Soong parser requirements."

      - name: "Test 5: Mediatek SEPolicy Rules Check"
        run: |
          cd workspace
          echo "== Verifying Mediatek SEPolicy Source Tree =="
          test -d device/mediatek/sepolicy_vndr
          test -f device/mediatek/sepolicy_vndr/SEPolicy.mk
          echo "SEPolicy makefiles present: $(ls device/mediatek/sepolicy_vndr/*.mk | wc -l)"
          echo "Vendor SEPolicy policy rules count: $(find device/mediatek/sepolicy_vndr -name '*.te' | wc -l) files"
          echo "✓ Mediatek vendor sepolicy definitions verified."
