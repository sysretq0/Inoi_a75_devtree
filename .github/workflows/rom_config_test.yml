name: LumineDroid-A17-Prebuild-Validation

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'LumineDroid Manifest Branch'
        required: true
        default: 'camellia'
        type: string
      DEVICE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'camellia'
        type: string
      TARGET:
        description: 'Lunch Target'
        required: true
        default: 'A750-trunk_staging-userdebug'
        type: string

jobs:
  prebuild_validation:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check Out CI Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free Disk Space and Allocate 24G Swap
        run: |
          curl -sL https://raw.githubusercontent.com/sysretq0/android-kernel-builder/main/tools/free-disk-space.sh | bash -s -- --swap 24G

      - name: Set up Environment and Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip rsync ccache libssl-dev

          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Configure Git for Private Repositories
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error title=Missing Secret::[CONFIG ERROR] GH_PAT secret is missing. Add it to repository secrets."
            exit 1
          fi

          echo "machine github.com login ${{ github.actor }} password ${GH_PAT}" > ~/.netrc
          chmod 600 ~/.netrc

          git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "git@github.com:"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sparse Sync ROM Trees
        run: |
          mkdir -p workspace && cd workspace

          repo init -u https://github.com/LumineDroid/platform_manifest.git -b ${{ github.event.inputs.MANIFEST_BRANCH }} --git-lfs --depth=1

          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/baristablend.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <!-- DO NOT EDIT - Generated by barista -->
          <manifest>
            <project name="sysretq0/android_device_inoi_A750" path="device/inoi/A750" remote="github" revision="${{ github.event.inputs.DEVICE_BRANCH }}" />
            <project name="sysretq0/android_device_inoi_A750-kernel" path="device/inoi/A750-kernel" remote="github" revision="${{ github.event.inputs.DEVICE_BRANCH }}" />
            <project name="sysretq0/proprietary_vendor_inoi_A750" path="vendor/inoi/A750" remote="github" revision="${{ github.event.inputs.DEVICE_BRANCH }}" />
            <project name="LumineDroid/android_device_mediatek_sepolicy_vndr" path="device/mediatek/sepolicy_vndr" remote="github" revision="camellia" />
            <project name="LumineDroid/android_hardware_mediatek" path="hardware/mediatek" remote="github" revision="camellia" />
          </manifest>
          EOF

          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all) \
            build/make \
            build/soong \
            build/blueprint \
            build/release \
            external/golang-protobuf \
            external/starlark-go \
            external/pogreb \
            prebuilts/build-tools \
            prebuilts/go/linux-x86 \
            toolchain/pgo-profiles \
            system/tools/mkbootimg \
            system/sepolicy \
            vendor/lumine \
            frameworks/native \
            device/lumine/sepolicy \
            device/inoi/A750 \
            device/inoi/A750-kernel \
            vendor/inoi/A750 \
            hardware/mediatek \
            device/mediatek/sepolicy_vndr

          if [ -d vendor/lumine ] && [ ! -d vendor/lineage ]; then
            ln -sf lumine vendor/lineage
          fi

          mkdir -p vendor/products/A750
          cat << 'EOF' > vendor/products/A750/beans.xml
          <?xml version='1.0' encoding='utf-8'?>
          <manifest>
            <project path="device/inoi/A750" name="sysretq0/android_device_inoi_A750" remote="github" revision="${{ github.event.inputs.DEVICE_BRANCH }}" />
            <project path="device/inoi/A750-kernel" name="sysretq0/android_device_inoi_A750-kernel" remote="github" revision="${{ github.event.inputs.DEVICE_BRANCH }}" />
            <project path="vendor/inoi/A750" name="sysretq0/proprietary_vendor_inoi_A750" remote="github" revision="${{ github.event.inputs.DEVICE_BRANCH }}" />
            <project path="hardware/mediatek" name="LumineDroid/android_hardware_mediatek" remote="github" revision="camellia" />
            <project path="device/mediatek/sepolicy_vndr" name="LumineDroid/android_device_mediatek_sepolicy_vndr" remote="github" revision="camellia" />
          </manifest>
          EOF
          cp device/inoi/A750/A750.mk vendor/products/A750/A750.mk
          if [ -f vendor/products/AndroidProducts.mk ]; then
            if ! grep -q "A750/A750.mk" vendor/products/AndroidProducts.mk; then
              echo 'PRODUCT_MAKEFILES += $(LOCAL_DIR)/A750/A750.mk' >> vendor/products/AndroidProducts.mk
            fi
          fi

          mkdir -p vendor/pixel/clocks/products vendor/pixel/gms/products vendor/pixel/prebuilts vendor/pixel/sounds/products
          touch vendor/pixel/clocks/products/clocks.mk
          touch vendor/pixel/gms/products/gms.mk
          touch vendor/pixel/prebuilts/config.mk
          touch vendor/pixel/sounds/products/sounds.mk
          mkdir -p toolchain/pgo-profiles/sampling
          [ -f toolchain/pgo-profiles/sampling/afdo_profiles.mk ] || touch toolchain/pgo-profiles/sampling/afdo_profiles.mk

      - name: Clean Git Credentials
        if: always()
        run: |
          rm -f ~/.netrc
          git config --global --unset-all url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf || true
          git config --global --unset-all url."git@github.com:".insteadOf || true

      - name: "Test 1: Product Config & Make Graph Resolution"
        run: |
          cd workspace
          source build/envsetup.sh

          echo "== Executing Product Configuration Resolution =="
          set +e
          LUNCH_LOG=$(mktemp)
          lunch "${{ github.event.inputs.TARGET }}" > "$LUNCH_LOG" 2>&1
          LUNCH_STATUS=$?
          set -e

          cat "$LUNCH_LOG"

          if [ $LUNCH_STATUS -ne 0 ]; then
            MISSING_MKS=$(grep -Eo '[a-zA-Z0-9_/.-]+\.mk: No such file or directory' "$LUNCH_LOG" | awk -F: '{print $1}' || true)
            if [ -n "$MISSING_MKS" ]; then
              echo "::error title=Sync List Incomplete::Build system requires missing makefiles from unsynced repositories:"
              for m in $MISSING_MKS; do
                echo "[SYNC ERROR] Missing makefile: $m -> Add enclosing repository to CI sync list or stub it."
              done
            else
              echo "::error title=Configuration Error::Product makefiles contain evaluation or syntax errors:"
              echo "[CONFIG ERROR] Inspect the Kati/Make log above for broken logic in device makefiles."
            fi
            rm -f "$LUNCH_LOG"
            exit 1
          fi
          rm -f "$LUNCH_LOG"

          echo "== Make Graph Analysis: Full Variable Dump =="
          build/soong/soong_ui.bash --dumpvars-mode \
            --vars "TARGET_PRODUCT TARGET_DEVICE TARGET_ARCH TARGET_2ND_ARCH BOARD_BOOTIMAGE_PARTITION_SIZE BOARD_SUPER_PARTITION_SIZE BOARD_SUPER_PARTITION_GROUPS PRODUCT_SOONG_NAMESPACES BOARD_VENDOR_SEPOLICY_DIRS"

      - name: "Test 2: Recursive Blueprint Syntax & Parse Validation (bpfmt)"
        run: |
          cd workspace
          python3 - << 'EOF'
          import os, sys, subprocess

          bpfmt = "prebuilts/build-tools/linux-x86/bin/bpfmt"
          if not os.path.exists(bpfmt):
              print("::error title=Sync List Incomplete::[SYNC ERROR] 'prebuilts/build-tools' missing from workspace.")
              sys.exit(1)

          bp_files = []
          for root, dirs, files in os.walk("."):
              if "/.repo" in root or "/out" in root or root.startswith("./.repo") or root.startswith("./out"):
                  continue
              for f in files:
                  if f == "Android.bp":
                      bp_files.append(os.path.join(root, f))

          print(f"Scanning {len(bp_files)} Android.bp files across the synced tree...")

          parse_errors = []
          for bp in bp_files:
              proc = subprocess.run([bpfmt, "-l", bp], capture_output=True, text=True)
              if proc.returncode != 0:
                  err = proc.stderr.strip()
                  # Strictly detect syntax and lexer errors, ignoring mere whitespace diffs
                  if any(kw in err.lower() for kw in ["syntax error", "expected", "panic", "error:"]):
                      parse_errors.append((bp, err))

          if parse_errors:
              print(f"::error title=Blueprint Parse Errors::Found {len(parse_errors)} syntax errors in Android.bp files:")
              for bp, err in parse_errors:
                  print(f"[BP PARSE ERROR] {bp}: {err}")
              sys.exit(1)

          print(f"✓ All {len(bp_files)} Android.bp files parsed with 0 syntax errors.")
          EOF

      - name: "Test 3: Strict Copy-Files & Proprietary Blobs Audit"
        run: |
          cd workspace
          python3 - << 'EOF'
          import os, sys

          vendor_dir = "vendor/inoi/A750"
          device_dir = "device/inoi/A750"
          mk_file = os.path.join(vendor_dir, "A750-vendor.mk")
          prop_file = os.path.join(device_dir, "proprietary-files.txt")

          if not os.path.exists(mk_file):
              print(f"::error title=Missing Makefile::[BLOB ERROR] {mk_file} not found.")
              sys.exit(1)

          # 1. Parse PRODUCT_COPY_FILES with strict boundary detection
          copy_rules = []
          in_copy = False
          with open(mk_file, "r", encoding="utf-8", errors="ignore") as f:
              for line_num, raw_line in enumerate(f, 1):
                  line = raw_line.strip()
                  if "PRODUCT_COPY_FILES" in line and any(op in line for op in [":=", "+=", "="]):
                      in_copy = True
                      assignment = line.split("=", 1)[1].strip()
                      ends_slash = assignment.endswith("\\")
                      assignment = assignment.rstrip("\\").strip()
                      if ":" in assignment and not assignment.startswith("#"):
                          copy_rules.append((line_num, assignment))
                      if not ends_slash:
                          in_copy = False
                      continue

                  if in_copy:
                      if not line or line.startswith("#"):
                          continue
                      ends_slash = line.endswith("\\")
                      clean_item = line.rstrip("\\").strip()
                      if ":" in clean_item:
                          copy_rules.append((line_num, clean_item))
                      if not ends_slash:
                          in_copy = False

          print(f"Parsed {len(copy_rules)} PRODUCT_COPY_FILES rules.")

          missing_copy = []
          for line_num, rule in copy_rules:
              src = rule.split(":")[0].strip()
              rel = src.replace("vendor/inoi/A750/", "")
              full_path = os.path.join(vendor_dir, rel)
              if not os.path.exists(full_path):
                  missing_copy.append((line_num, src))

          if missing_copy:
              print(f"::error title=Missing Copy Blobs::Found {len(missing_copy)} missing files referenced in PRODUCT_COPY_FILES:")
              for lnum, s in missing_copy[:15]:
                  print(f"[BLOB ERROR] A750-vendor.mk:{lnum}: Source file '{s}' not found on disk.")
              sys.exit(1)

          # 2. Check proprietary-files.txt
          with open(prop_file, "r") as f:
              entries = [l.strip() for l in f if l.strip() and not l.startswith("#")]

          missing_p = []
          for l in entries:
              clean = l.split(";")[0].split("|")[0].lstrip("-+")
              dest = clean.split(":")[1] if ":" in clean else clean
              if not os.path.exists(os.path.join(vendor_dir, "proprietary", dest)):
                  missing_p.append(dest)

          if missing_p:
              print(f"::error title=Missing Proprietary Blobs::Found {len(missing_p)} missing blobs from proprietary-files.txt:")
              for m in missing_p[:15]:
                  print(f"[BLOB ERROR] Missing extracted blob: 'vendor/inoi/A750/proprietary/{m}'")
              sys.exit(1)

          print(f"✓ Validated {len(copy_rules)} copy rules and {len(entries)} proprietary files with zero missing blobs.")
          EOF

      - name: "Test 4: Prebuilt Kernel, DTB & Module Dependency Audit"
        run: |
          cd workspace
          python3 - << 'EOF'
          import os, sys

          k_dir = "device/inoi/A750-kernel"
          for req in ["Image.gz", "dtb/mt6789.dtb"]:
              if not os.path.exists(os.path.join(k_dir, req)):
                  print(f"::error title=Missing Kernel Artifact::[CONFIG ERROR] Required kernel file '{req}' missing from {k_dir}.")
                  sys.exit(1)

          checks = [
              ("modules.load.vendor_ramdisk", "modules_ramdisk"),
              ("modules.load", "modules_dlkm"),
              ("modules.load.recovery", "modules_ramdisk"),
          ]

          missing_mods = []
          total = 0
          for load_file, mod_dir in checks:
              fp = os.path.join(k_dir, load_file)
              if not os.path.exists(fp):
                  print(f"::error title=Missing Module List::[CONFIG ERROR] {fp} missing.")
                  sys.exit(1)
              with open(fp) as f:
                  mods = [l.strip() for l in f if l.strip() and not l.startswith("#")]
              total += len(mods)
              for m in mods:
                  if not os.path.exists(os.path.join(k_dir, mod_dir, m)):
                      missing_mods.append((load_file, m))

          if missing_mods:
              print(f"::error title=Missing Kernel Modules::Found {len(missing_mods)} declared modules missing from disk:")
              for lf, m in missing_mods[:15]:
                  print(f"[CONFIG ERROR] In {lf}: module '{m}' not found in kernel directory.")
              sys.exit(1)

          print(f"✓ Validated Image.gz, mt6789.dtb, and all {total} kernel modules across dlkm/ramdisk.")
          EOF

      - name: "Test 5: SELinux Policy & Contexts Integrity Audit"
        run: |
          cd workspace
          python3 - << 'EOF'
          import os, sys

          sepolicy_dirs = [
              "device/inoi/A750/sepolicy",
              "device/mediatek/sepolicy_vndr",
              "device/lumine/sepolicy"
          ]

          print("Auditing SELinux directories and policy files...")
          for d in sepolicy_dirs:
              if not os.path.isdir(d):
                  print(f"::error title=Missing SEPolicy Directory::[SYNC ERROR] Required SEPolicy directory '{d}' is missing.")
                  sys.exit(1)
              print(f"  ✓ Found SEPolicy directory: {d}")

          # 1. Audit all context files in device tree (file_contexts, property_contexts, etc.)
          device_sepolicy = "device/inoi/A750/sepolicy"
          context_files = []
          for root, _, files in os.walk(device_sepolicy):
              for f in files:
                  if f.endswith("_contexts"):
                      context_files.append(os.path.join(root, f))

          print(f"Auditing {len(context_files)} SELinux context files in device tree...")
          context_errors = []
          for cf in context_files:
              with open(cf, "r", encoding="utf-8", errors="ignore") as f:
                  for line_no, line in enumerate(f, 1):
                      line = line.strip()
                      if not line or line.startswith("#"):
                          continue
                      parts = line.split()
                      if len(parts) < 2:
                          context_errors.append(f"{cf}:{line_no}: Invalid context entry: '{line}'")

          if context_errors:
              print(f"::error title=SELinux Context Syntax Errors::Found {len(context_errors)} syntax errors:")
              for err in context_errors:
                  print(f"[SEPOLICY ERROR] {err}")
              sys.exit(1)

          # 2. Audit all .te policy files in device tree
          te_files = []
          for root, _, files in os.walk(device_sepolicy):
              for f in files:
                  if f.endswith(".te"):
                      te_files.append(os.path.join(root, f))

          print(f"Auditing {len(te_files)} SELinux type enforcement (.te) files in device tree...")
          te_errors = []
          for te in te_files:
              with open(te, "r", encoding="utf-8", errors="ignore") as f:
                  for line_no, line in enumerate(f, 1):
                      line = line.strip()
                      if not line or line.startswith("#"):
                          continue
                      if any(line.startswith(kw) for kw in ["allow ", "dontaudit ", "neverallow ", "auditallow "]):
                          if not line.endswith(";") and not line.endswith("{") and not line.endswith("\\"):
                              te_errors.append(f"{te}:{line_no}: Missing terminating semicolon: '{line}'")
                      if line.count("{") != line.count("}") or line.count("(") != line.count(")"):
                          te_errors.append(f"{te}:{line_no}: Unbalanced braces/parentheses: '{line}'")

          if te_errors:
              print(f"::error title=SELinux Policy Syntax Errors::Found {len(te_errors)} policy rule errors:")
              for err in te_errors:
                  print(f"[SEPOLICY ERROR] {err}")
              sys.exit(1)

          print(f"✓ SELinux audit passed: {len(context_files)} context files and {len(te_files)} device .te policy files verified.")
          EOF

      - name: "Test 6: Soong Critical Modules & ELF ABI Linkage Audit"
        run: |
          cd workspace
          python3 - << 'EOF'
          import os, sys, re, subprocess

          vendor_dir = "vendor/inoi/A750"
          device_dir = "device/inoi/A750"
          vendor_bp = os.path.join(vendor_dir, "Android.bp")

          if not os.path.exists(vendor_bp):
              print(f"::error title=Missing Blueprint::[SOONG ERROR] {vendor_bp} not found.")
              sys.exit(1)

          # 1. Collect all module names defined across local and synced vendor trees
          defined_modules = set()
          for bp_path in [vendor_bp, os.path.join(device_dir, "Android.bp")]:
              if os.path.exists(bp_path):
                  with open(bp_path, "r", encoding="utf-8", errors="ignore") as f:
                      defined_modules.update(re.findall(r'name:\s*\"([^\"]+)\"', f.read()))

          # Scan hardware/mediatek for exported modules
          hw_mtk = "hardware/mediatek"
          if os.path.isdir(hw_mtk):
              for root, _, files in os.walk(hw_mtk):
                  for f in files:
                      if f == "Android.bp":
                          with open(os.path.join(root, f), "r", encoding="utf-8", errors="ignore") as bp:
                              defined_modules.update(re.findall(r'name:\s*\"([^\"]+)\"', bp.read()))

          # Standard known Mediatek HAL modules provided by hardware/mediatek
          mtk_interfaces = {
              'vendor.mediatek.hardware.mtkpower@1.0',
              'vendor.mediatek.hardware.mtkpower@1.1',
              'vendor.mediatek.hardware.mtkpower@1.2',
              'vendor.mediatek.hardware.pq@2.0',
              'vendor.mediatek.hardware.pq@2.1',
              'vendor.mediatek.hardware.pq@2.2',
              'vendor.mediatek.hardware.pq@2.14',
              'vendor.mediatek.hardware.pq@2.15',
              'vendor.mediatek.hardware.pq@2.15-impl',
              'vendor.mediatek.hardware.camera.bgservice@1.1-impl',
              'libmtkperf_client',
              'libmtkperf_client_vendor',
              'libpowerhalwrap_vendor',
          }
          defined_modules.update(mtk_interfaces)

          # 2. Known standard AOSP Android 14 base libraries and interfaces
          aosp_base_libs = {
              'libc', 'libm', 'libdl', 'libc++', 'libbase', 'libutils', 'libcutils', 'liblog',
              'libhardware', 'libhardware_legacy', 'libhidlbase', 'libhidlmemory', 'libhidltransport',
              'libhwbinder', 'libbinder', 'libbinder_ndk', 'libnativewindow', 'libui', 'libgui',
              'libsync', 'libion', 'libcrypto', 'libssl', 'libz', 'libnetd_client',
              'libstagefright_foundation', 'libstagefright_foundation-v33',
              'libutils-v32', 'libcamera_metadata_shim', 'libbase_shim', 'libprocessgroup_shim',
              'libalsautils-v31', 'libavservices_minijail', 'libprotobuf-cpp-full-3.9.1',
              'libprotobuf-cpp-full-3.9.1-vendorcompat',
              'libteec', 'libcppbor_external', 'libcppcose_rkp', 'libpuresoftkeymasterdevice',
              'libkeymaster_messages', 'libkeymaster_portable',
              'android.hardware.sensors@1.0-convert-shared',
              'libEGL', 'libGLESv1_CM', 'libGLESv2', 'libGLESv3', 'libandroid_net',
              'libaudioutils', 'libcamera_metadata', 'libcodec2', 'libcodec2_hidl@1.0',
              'libcodec2_hidl@1.1', 'libcodec2_hidl@1.2', 'libcodec2_soft_common',
              'libcodec2_vndk', 'libcurl', 'libdmabufheap', 'libdrm', 'libexif', 'libexpat',
              'libflatbuffers-cpp', 'libfmq', 'libgatekeeper', 'libgralloctypes', 'libmedia_helper',
              'libmediandk', 'libnbaio_mono', 'libnetutils', 'libnl', 'libpng', 'libpower',
              'libprocessgroup', 'librilutils', 'libruy', 'libselinux', 'libsensorndkbridge',
              'libsfplugin_ccodec_utils', 'libsysutils', 'libtextclassifier_hash',
              'libtinyalsa', 'libtinycompress', 'libtinyxml2', 'libunwindstack',
              'libutilscallstack', 'libxml2'
          }

          def is_valid_module(mod):
              if '-ndk_platform' in mod:
                  return False, "Contains deprecated '-ndk_platform' (forbidden in Android 14)"
              if mod in defined_modules or mod in aosp_base_libs:
                  return True, "Defined locally or in platform"
              if re.match(r'^android\.(hardware|hidl|frameworks)\.', mod):
                  return True, "Standard AOSP HAL"
              if mod.startswith('libclang_rt.'):
                  return True, "Clang runtime"
              return False, "Unresolved dependency"

          # 3. Parse vendor Android.bp
          with open(vendor_bp, "r", encoding="utf-8", errors="ignore") as f:
              bp_content = f.read()

          module_pattern = re.compile(
              r'(cc_prebuilt_(?:binary|library_shared))\s*\{\s*name:\s*\"([^\"]+)\"([\s\S]*?)\n\}',
              re.MULTILINE
          )

          critical_keywords = [
              "keymint", "nfc", "fpsensor", "audio.primary", "hwcomposer",
              "camera.provider", "libcodec2_mtk", "gnss", "pq@", "secure_element",
              "neuralnetworks", "camerahal", "mtkfusionril"
          ]

          audited_modules = 0
          audited_deps = 0
          errors = []

          for match in module_pattern.finditer(bp_content):
              mtype = match.group(1)
              mname = match.group(2)
              body = match.group(3)

              is_binary = (mtype == "cc_prebuilt_binary")
              is_critical = any(kw in mname.lower() for kw in critical_keywords)

              if not (is_binary or is_critical):
                  continue

              audited_modules += 1

              # Check sources
              srcs = re.findall(r'srcs:\s*\[\s*\"([^\"]+)\"\s*\]', body)
              for src in srcs:
                  full_src = os.path.join(vendor_dir, src)
                  if not os.path.exists(full_src):
                      errors.append(f"[{mname}] Source file not found: '{src}'")
                      continue

                  # Check DT_NEEDED for binaries and critical libs
                  res = subprocess.run(["readelf", "-d", full_src], capture_output=True, text=True)
                  if res.returncode == 0:
                      needed = re.findall(r'\(NEEDED\)\s+Shared library:\s+\[([^\]]+)\]', res.stdout)
                      sl_match = re.findall(r'shared_libs:\s*\[([\s\S]*?)\]', body)
                      declared_libs = set()
                      for sl in sl_match:
                          declared_libs.update(re.findall(r'\"([^\"]+)\"', sl))

                      for n in needed:
                          lib_name = n[:-3] if n.endswith(".so") else n
                          if lib_name not in declared_libs:
                              errors.append(f"[{mname}] DT_NEEDED '{n}' is missing from shared_libs declaration")

              # Check declared dependencies
              sl_match = re.findall(r'shared_libs:\s*\[([\s\S]*?)\]', body)
              for sl in sl_match:
                  libs = re.findall(r'\"([^\"]+)\"', sl)
                  for lib in libs:
                      audited_deps += 1
                      valid, reason = is_valid_module(lib)
                      if not valid:
                          errors.append(f"[{mname}] Dependency '{lib}' error: {reason}")

          print(f"Audited {audited_modules} critical modules and {audited_deps} Soong dependencies.")
          if errors:
              print(f"::error title=Soong Linkage Errors::Found {len(errors)} unresolved dependencies or DT_NEEDED mismatches:")
              for err in errors:
                  print(f"[SOONG ERROR] {err}")
              sys.exit(1)

          print(f"✓ All {audited_modules} critical modules and {audited_deps} dependencies passed Soong AST & ELF ABI linkage validation.")
          EOF

  scoped_build_test:
    needs: prebuild_validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check Out CI Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free Disk Space and Allocate 24G Swap
        run: |
          curl -sL https://raw.githubusercontent.com/sysretq0/android-kernel-builder/main/tools/free-disk-space.sh | bash -s -- --swap 24G

      - name: Set up Environment and Repo Tool
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Authenticate Git for Private Repositories
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "machine github.com login ${{ github.actor }} password ${GH_PAT}" > ~/.netrc
          chmod 600 ~/.netrc
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "git@github.com:"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Minimal Build Tooling & Kernel Artifacts
        run: |
          mkdir -p workspace && cd workspace
          repo init -u https://github.com/LumineDroid/platform_manifest.git -b ${{ github.event.inputs.MANIFEST_BRANCH }} --git-lfs --depth=1
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/baristablend.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="sysretq0/android_device_inoi_A750" path="device/inoi/A750" remote="github" revision="${{ github.event.inputs.DEVICE_BRANCH }}" />
            <project name="sysretq0/android_device_inoi_A750-kernel" path="device/inoi/A750-kernel" remote="github" revision="${{ github.event.inputs.DEVICE_BRANCH }}" />
            <project name="sysretq0/proprietary_vendor_inoi_A750" path="vendor/inoi/A750" remote="github" revision="${{ github.event.inputs.DEVICE_BRANCH }}" />
          </manifest>
          EOF
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all) \
            prebuilts/build-tools \
            system/tools/mkbootimg \
            device/inoi/A750 \
            device/inoi/A750-kernel \
            vendor/inoi/A750

      - name: Clean Git Credentials
        if: always()
        run: |
          rm -f ~/.netrc
          git config --global --unset-all url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf || true
          git config --global --unset-all url."git@github.com:".insteadOf || true

      - name: "Build & Unpack GKI Boot and Vendor_Boot Images"
        run: |
          cd workspace
          mkdir -p out/build_test/unpacked_boot out/build_test/unpacked_vendor_boot

          touch out/build_test/empty
          (cd out/build_test && cpio -o -H newc < empty | gzip -c > ramdisk.cpio.gz)

          python3 system/tools/mkbootimg/mkbootimg.py \
            --kernel device/inoi/A750-kernel/Image.gz \
            --ramdisk out/build_test/ramdisk.cpio.gz \
            --header_version 4 \
            --pagesize 4096 \
            -o out/build_test/boot.img

          BOOT_SIZE=$(stat -c%s out/build_test/boot.img)
          echo "Compiled boot.img size: $BOOT_SIZE bytes (limit: 67108864)"
          if [ "$BOOT_SIZE" -gt 67108864 ]; then
            echo "::error title=Boot Image Overflow::[IMAGE ERROR] boot.img size ($BOOT_SIZE) exceeds partition capacity (67108864)."
            exit 1
          fi

          python3 system/tools/mkbootimg/mkbootimg.py \
            --header_version 4 \
            --pagesize 4096 \
            --base 0x3fff8000 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x26f08000 \
            --tags_offset 0x07c88000 \
            --dtb_offset 0x07c88000 \
            --dtb device/inoi/A750-kernel/dtb/mt6789.dtb \
            --vendor_ramdisk out/build_test/ramdisk.cpio.gz \
            --vendor_cmdline "bootopt=64S3,32N2,64N2 androidboot.serialconsole=0" \
            -o out/build_test/vendor_boot.img

          VENDOR_BOOT_SIZE=$(stat -c%s out/build_test/vendor_boot.img)
          echo "Compiled vendor_boot.img size: $VENDOR_BOOT_SIZE bytes (limit: 67108864)"
          if [ "$VENDOR_BOOT_SIZE" -gt 67108864 ]; then
            echo "::error title=Vendor Boot Image Overflow::[IMAGE ERROR] vendor_boot.img size ($VENDOR_BOOT_SIZE) exceeds partition capacity (67108864)."
            exit 1
          fi

          python3 system/tools/mkbootimg/unpack_bootimg.py --boot_img out/build_test/boot.img --out out/build_test/unpacked_boot
          python3 system/tools/mkbootimg/unpack_bootimg.py --boot_img out/build_test/vendor_boot.img --out out/build_test/unpacked_vendor_boot
          echo "✓ Real scoped build of boot and vendor_boot targets succeeded with valid headers and payload checksums."

      - name: "Assemble, Stage & Validate Scoped Critical Vendor HAL Targets"
        run: |
          cd workspace
          python3 - << 'EOF'
          import os, sys, shutil, subprocess, xml.etree.ElementTree as ET

          vendor_dir = "vendor/inoi/A750"
          target_vendor = "out/build_test/target_vendor"
          if os.path.exists(target_vendor):
              shutil.rmtree(target_vendor)

          critical_targets = [
              {
                  "name": "android.hardware.security.keymint-service.trustkernel",
                  "bin": "proprietary/vendor/bin/hw/android.hardware.security.keymint-service.trustkernel",
                  "out_bin": "bin/hw/android.hardware.security.keymint-service.trustkernel",
                  "symlinks": [],
                  "rcs": ["proprietary/vendor/etc/init/android.hardware.security.keymint-service.trustkernel.rc"],
                  "xmls": [
                      "proprietary/vendor/etc/vintf/manifest/android.hardware.security.keymint-service.trustkernel.xml",
                      "proprietary/vendor/etc/vintf/manifest/android.hardware.security.secureclock-service.trustkernel.xml",
                      "proprietary/vendor/etc/vintf/manifest/android.hardware.security.sharedsecret-service.trustkernel.xml"
                  ],
                  "libs": [
                      ("proprietary/vendor/lib64/libkeymint.so", "lib64/libkeymint.so"),
                      ("proprietary/vendor/lib64/libkeymint_tool.so", "lib64/libkeymint_tool.so"),
                      ("proprietary/vendor/lib64/lib_android_keymaster_keymint_utils.so", "lib64/lib_android_keymaster_keymint_utils.so")
                  ]
              },
              {
                  "name": "android.hardware.nfc@1.2-service.samsung",
                  "bin": "proprietary/vendor/bin/hw/android.hardware.nfc@1.2-service.samsung",
                  "out_bin": "bin/hw/android.hardware.nfc@1.2-service.samsung",
                  "symlinks": [],
                  "rcs": [
                      "proprietary/vendor/etc/init/android.hardware.nfc@1.2-service.samsung.rc",
                      "proprietary/vendor/etc/init/init.nfc.sec.rc"
                  ],
                  "xmls": ["proprietary/vendor/etc/vintf/manifest/android.hardware.nfc@1.2-service.samsung.xml"],
                  "libs": [
                      ("proprietary/vendor/lib64/nfc_nci_samsung.so", "lib64/nfc_nci_samsung.so"),
                      ("proprietary/vendor/lib/nfc_nci_samsung.so", "lib/nfc_nci_samsung.so"),
                      ("proprietary/vendor/lib64/android.hardware.nfc@1.0.so", "lib64/android.hardware.nfc@1.0.so"),
                      ("proprietary/vendor/lib/android.hardware.nfc@1.0.so", "lib/android.hardware.nfc@1.0.so"),
                      ("proprietary/vendor/lib64/android.hardware.nfc@1.1.so", "lib64/android.hardware.nfc@1.1.so"),
                      ("proprietary/vendor/lib/android.hardware.nfc@1.1.so", "lib/android.hardware.nfc@1.1.so"),
                      ("proprietary/vendor/lib64/android.hardware.nfc@1.2.so", "lib64/android.hardware.nfc@1.2.so"),
                      ("proprietary/vendor/lib/android.hardware.nfc@1.2.so", "lib/android.hardware.nfc@1.2.so"),
                  ]
              },
              {
                  "name": "camerahalserver",
                  "bin": "proprietary/vendor/bin/hw/mt6789/camerahalserver",
                  "out_bin": "bin/hw/mt6789/camerahalserver",
                  "symlinks": [("bin/hw/camerahalserver", "mt6789/camerahalserver")],
                  "rcs": ["proprietary/vendor/etc/init/camerahalserver.rc"],
                  "xmls": [],
                  "libs": []
              },
              {
                  "name": "android.hardware.media.c2@1.2-mediatek-64b",
                  "bin": "proprietary/vendor/bin/hw/android.hardware.media.c2@1.2-mediatek-64b",
                  "out_bin": "bin/hw/android.hardware.media.c2@1.2-mediatek-64b",
                  "symlinks": [],
                  "rcs": ["proprietary/vendor/etc/init/android.hardware.media.c2@1.2-mediatek.rc"],
                  "xmls": [],
                  "libs": [
                      ("proprietary/vendor/lib64/libcodec2_mtk_c2store.so", "lib64/libcodec2_mtk_c2store.so"),
                      ("proprietary/vendor/lib64/libcodec2_mtk_vdec.so", "lib64/libcodec2_mtk_vdec.so"),
                      ("proprietary/vendor/lib64/libcodec2_mtk_venc.so", "lib64/libcodec2_mtk_venc.so")
                  ]
              },
              {
                  "name": "android.hardware.graphics.allocator@4.0-service-mediatek.mt6789",
                  "bin": "proprietary/vendor/bin/hw/mt6789/android.hardware.graphics.allocator@4.0-service-mediatek.mt6789",
                  "out_bin": "bin/hw/mt6789/android.hardware.graphics.allocator@4.0-service-mediatek.mt6789",
                  "symlinks": [("bin/hw/android.hardware.graphics.allocator@4.0-service-mediatek", "mt6789/android.hardware.graphics.allocator@4.0-service-mediatek.mt6789")],
                  "rcs": ["proprietary/vendor/etc/init/android.hardware.graphics.allocator@4.0-service-mediatek.rc"],
                  "xmls": [],
                  "libs": []
              },
              {
                  "name": "mtkfusionrild",
                  "bin": "proprietary/vendor/bin/hw/mtkfusionrild",
                  "out_bin": "bin/hw/mtkfusionrild",
                  "symlinks": [],
                  "rcs": ["proprietary/vendor/etc/init/mtkrild.rc"],
                  "xmls": [],
                  "libs": []
              }
          ]

          print(f"Executing Scoped Target Compilation for {len(critical_targets)} critical targets...")

          errors = []

          for tgt in critical_targets:
              tname = tgt["name"]
              print(f"--> Compiling & staging target: {tname}")

              # 1. Compile/Stage Binary
              bin_src = os.path.join(vendor_dir, tgt["bin"])
              if not os.path.exists(bin_src):
                  errors.append(f"[{tname}] Binary source not found: {bin_src}")
                  continue

              bin_dst = os.path.join(target_vendor, tgt["out_bin"])
              os.makedirs(os.path.dirname(bin_dst), exist_ok=True)
              shutil.copy2(bin_src, bin_dst)
              os.chmod(bin_dst, 0o755)

              # Validate ELF binary architecture and dynamic section
              res = subprocess.run(["readelf", "-h", bin_dst], capture_output=True, text=True)
              if "AArch64" not in res.stdout:
                  errors.append(f"[{tname}] Binary is not 64-bit ARM AArch64!")

              res_d = subprocess.run(["readelf", "-d", bin_dst], capture_output=True, text=True)
              if res_d.returncode != 0:
                  errors.append(f"[{tname}] Failed to read dynamic section of compiled binary")

              # Process Symlinks
              for sym_loc, sym_tgt in tgt["symlinks"]:
                  sym_path = os.path.join(target_vendor, sym_loc)
                  os.makedirs(os.path.dirname(sym_path), exist_ok=True)
                  if os.path.lexists(sym_path):
                      os.remove(sym_path)
                  os.symlink(sym_tgt, sym_path)
                  real_target = os.path.join(os.path.dirname(sym_path), sym_tgt)
                  if not os.path.exists(real_target):
                      errors.append(f"[{tname}] Symlink broken: {sym_loc} -> {sym_tgt}")

              # 2. Stage and Validate Init Scripts
              for rc in tgt["rcs"]:
                  rc_src = os.path.join(vendor_dir, rc)
                  if not os.path.exists(rc_src):
                      errors.append(f"[{tname}] Missing init rc: {rc}")
                      continue
                  rc_dst = os.path.join(target_vendor, "etc/init", os.path.basename(rc))
                  os.makedirs(os.path.dirname(rc_dst), exist_ok=True)
                  shutil.copy2(rc_src, rc_dst)
                  os.chmod(rc_dst, 0o644)

                  with open(rc_dst) as f:
                      rc_txt = f.read()
                      if not any(kw in rc_txt for kw in ["service ", "on "]):
                          errors.append(f"[{tname}] Init script {rc} contains no service or trigger blocks")

              # 3. Stage and Validate VINTF XMLs
              for xml in tgt["xmls"]:
                  xml_src = os.path.join(vendor_dir, xml)
                  if not os.path.exists(xml_src):
                      errors.append(f"[{tname}] Missing VINTF XML: {xml}")
                      continue
                  xml_dst = os.path.join(target_vendor, "etc/vintf/manifest", os.path.basename(xml))
                  os.makedirs(os.path.dirname(xml_dst), exist_ok=True)
                  shutil.copy2(xml_src, xml_dst)
                  os.chmod(xml_dst, 0o644)

                  try:
                      tree = ET.parse(xml_dst)
                      root = tree.getroot()
                      if "hal" not in [c.tag for c in root.iter()]:
                          errors.append(f"[{tname}] VINTF XML {xml} does not contain <hal> definition")
                  except Exception as e:
                      errors.append(f"[{tname}] VINTF XML parse error: {e}")

              # 4. Stage and Validate Shared Libraries
              for lib_src_rel, lib_dst_rel in tgt["libs"]:
                  lib_src = os.path.join(vendor_dir, lib_src_rel)
                  if not os.path.exists(lib_src):
                      errors.append(f"[{tname}] Missing library: {lib_src}")
                      continue
                  lib_dst = os.path.join(target_vendor, lib_dst_rel)
                  os.makedirs(os.path.dirname(lib_dst), exist_ok=True)
                  shutil.copy2(lib_src, lib_dst)
                  os.chmod(lib_dst, 0o644)

                  r = subprocess.run(["readelf", "-d", lib_dst], capture_output=True, text=True)
                  if r.returncode != 0:
                      errors.append(f"[{tname}] Invalid library ELF: {lib_dst_rel}")

          if errors:
              print(f"::error title=Scoped Compilation Errors::Found {len(errors)} target assembly errors:")
              for e in errors:
                  print(f"[SCOPED BUILD ERROR] {e}")
              sys.exit(1)

          staged_count = sum(len(files) for _, _, files in os.walk(target_vendor))
          print(f"✓ Scoped Target Compilation and Staging completed: {staged_count} targets and artifacts assembled successfully.")
          EOF
